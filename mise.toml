[tools]
hk = "2.7.0"
pkl = "0.32.1"
gitleaks = "8.30.1"
lychee = "0.24.2"
actionlint = "1.7.12"
cargo-deny = "0.20.2"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"github:bnjbvr/cargo-machete" = "0.9.2"
"github:nextest-rs/nextest" = { version = "0.9.148", version_prefix = "cargo-nextest-" }

[settings]
minimum_release_age = "3d"

[env]
_.file = ".env"
# A mise rust tool exports RUSTUP_TOOLCHAIN, which overrides rust-toolchain.toml.
RUSTUP_TOOLCHAIN = false

[tasks.setup]
description = "Install the pinned tools and the git hooks (run once per clone)"
run = ["mise install", "hk install --mise"]

[tasks.build]
description = "Build the release binary"
run = "cargo build --locked --release"

[tasks.test]
description = "Run the test suite with nextest"
sources = ["**/*.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]
run = "cargo nextest run --locked"

[tasks."test:e2e"]
description = "Run the local-only #[ignore] live checks that need real claude and gh auth (never run in CI)"
run = "cargo nextest run --locked --run-ignored only --no-tests=warn"

[tasks.coverage]
description = "Run the test suite under llvm-cov and fail below 80% line coverage"
run = "cargo llvm-cov nextest --locked --fail-under-lines 80"
