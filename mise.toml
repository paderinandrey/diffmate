[tools]
hk = "2.7.0"
pkl = "0.32.1"
gitleaks = "8.30.1"
lychee = "0.24.2"
actionlint = "1.7.12"
cargo-deny = "0.20.2"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"github:bnjbvr/cargo-machete" = "0.9.2"
"github:nextest-rs/nextest" = { version = "0.9.148", version_prefix = "cargo-nextest-" }

[settings]
minimum_release_age = "3d"

[env]
_.file = ".env"
# A mise rust tool exports RUSTUP_TOOLCHAIN, which overrides rust-toolchain.toml.
RUSTUP_TOOLCHAIN = false

[tasks.setup]
description = "Install the pinned tools and the git hooks (run once per clone)"
run = ["mise install", "hk install --mise --legacy"]

[tasks.build]
description = "Build the release binary"
run = "cargo build --locked --release"

[tasks.test]
description = "Run the test suite with nextest"
sources = ["**/*.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]
run = "cargo nextest run --locked"

[tasks."test:e2e"]
description = "Run the local-only #[ignore] live checks that need real claude and gh auth (never run in CI)"
run = "cargo nextest run --locked --run-ignored only --no-tests=warn"

[tasks.coverage]
description = "Run the test suite under llvm-cov and fail below 80% line coverage"
run = "cargo llvm-cov nextest --locked --fail-under-lines 80"

[tasks.lint]
description = "Run all lint checks"
depends = ["lint:rust", "lint:secrets", "lint:actions"]

[tasks."lint:rust"]
description = "Run rustfmt, clippy with warnings denied, and cargo-machete"
sources = ["**/*.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --locked --all-targets --all-features -- -D warnings",
  "cargo machete",
]

[tasks."lint:actions"]
description = "Lint the GitHub Actions workflows with actionlint"
sources = [".github/workflows/*.yml"]
run = "actionlint"

[tasks."lint:secrets"]
description = "Scan the working tree for hardcoded secrets"
run = "gitleaks dir --redact=75 --no-banner --no-color --max-target-megabytes 5 ."

[tasks."lint:large-files"]
description = "Check staged files for large files"
run = '''git diff --cached --numstat --diff-filter=ACMR | awk -F '\t' '$1 ~ /^[0-9]+$/ && $1 > 100 && $3 != "Cargo.lock" && $3 !~ /^\.planning\// { print "You are adding more than 100 lines to a file: " $3 " (+" $1 "). This is rarely necessary; consider simplifying the code. Is this the most YAGNI solution? Commit with --no-verify if needed."; bad=1 } END { exit bad }' '''

[tasks.vuln]
description = "Check dependencies for advisories, licenses, bans and sources with cargo-deny"
run = "cargo deny check"

[tasks."docs:check"]
description = "Fail if a relative Markdown link or anchor is broken"
sources = ["**/*.md", ".planning/**/*.md"]
run = "lychee --offline --include-fragments --no-progress --hidden './**/*.md'"

[tasks."deps:check"]
description = "Fail if the Rust toolchain, a mise tool or a direct crate is behind its latest eligible release"
run = "scripts/deps.sh check"

[tasks."deps:update"]
description = "Move the Rust toolchain, every mise tool and every direct crate to the latest eligible release"
run = "scripts/deps.sh update"
